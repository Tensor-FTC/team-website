[build]
  command = "npm run build"
  publish = "dist"

# React Router owns the URL, so every path that is not a real file has to be
# served the app shell. Without this, refreshing /team returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes, so it can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
